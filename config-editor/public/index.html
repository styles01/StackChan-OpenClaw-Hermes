<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Stack-chan Config</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="container">
    <h1>🤖 Stack-chan Config</h1>

    <!-- Robot IP -->
    <div class="section">
      <label for="robotIp">Robot IP Address</label>
      <input type="text" id="robotIp" placeholder="192.168.2.xxx" class="ip-input">
      <div class="btn-row">
        <button id="loadBtn" class="btn btn-primary">Load from Robot</button>
        <button id="pushBtn" class="btn btn-primary">Save & Push</button>
        <button id="localBtn" class="btn btn-secondary">Save Local</button>
      </div>
    </div>

    <div id="status"></div>
    <div id="error"></div>

    <!-- Backend Selector -->
    <div class="section">
      <h2>Backend</h2>
      <label for="backend">Backend</label>
      <select id="backend" class="select">
        <option value="0">OpenClaw</option>
        <option value="1">Hermes</option>
      </select>
    </div>

    <!-- Agent Profile -->
    <div class="section">
      <h2>Agent Profile</h2>
      <label for="oc_agent_id">Agent ID</label>
      <input type="text" id="oc_agent_id" placeholder="your-agent" data-config="openclaw.agent_id">
      <label for="oc_bot_token">Bot Token</label>
      <input type="password" id="oc_bot_token" placeholder="Telegram bot token" data-config="openclaw.bot_token">
      <label for="oc_default_model">Default Model</label>
      <input type="text" id="oc_default_model" placeholder="openclaw/your-agent" data-config="openclaw.default_model">
    </div>

    <!-- OpenClaw Settings -->
    <div class="section" id="openclawSection">
      <h2>OpenClaw</h2>
      <label for="oc_host">Host IP</label>
      <input type="text" id="oc_host" placeholder="<your-server-ip>" data-config="openclaw.host">
      <label for="oc_port">Port</label>
      <input type="number" id="oc_port" placeholder="18789" data-config="openclaw.port">
      <label for="oc_model">Model</label>
      <input type="text" id="oc_model" placeholder="openclaw/your-agent" data-config="openclaw.model">
    </div>

    <!-- Hermes Settings -->
    <div class="section" id="hermesSection">
      <h2>Hermes</h2>
      <label for="hm_host">Host IP</label>
      <input type="text" id="hm_host" placeholder="" data-config="hermes.host">
      <label for="hm_port">Port</label>
      <input type="number" id="hm_port" placeholder="" data-config="hermes.port">
      <label for="hm_model">Model</label>
      <input type="text" id="hm_model" placeholder="" data-config="hermes.model">
      <label for="hm_agent_id">Agent ID</label>
      <input type="text" id="hm_agent_id" placeholder="" data-config="hermes.agent_id">
      <label for="hm_bot_token">Bot Token</label>
      <input type="password" id="hm_bot_token" placeholder="" data-config="hermes.bot_token">
      <label for="hm_default_model">Default Model</label>
      <input type="text" id="hm_default_model" placeholder="" data-config="hermes.default_model">
    </div>

    <!-- LLM -->
    <div class="section">
      <h2>LLM</h2>
      <label for="llm_type">Type</label>
      <select id="llm_type" class="select" data-config="llm.type">
        <option value="0">ChatGPT</option>
        <option value="1">ModuleLLM</option>
        <option value="2">ModuleLLM (FnCl)</option>
        <option value="3">Gemini</option>
        <option value="4" selected>OpenClaw</option>
      </select>
      <label for="llm_model">Model</label>
      <input type="text" id="llm_model" placeholder="" data-config="llm.model">
      <label for="llm_enableMemory">Enable Memory</label>
      <select id="llm_enableMemory" class="select" data-config="llm.enableMemory">
        <option value="false">No</option>
        <option value="true">Yes</option>
      </select>
    </div>

    <!-- TTS -->
    <div class="section">
      <h2>TTS</h2>
      <label for="tts_type">Type</label>
      <select id="tts_type" class="select" data-config="tts.type">
        <option value="0">VoiceVox</option>
        <option value="1">ElevenLabs</option>
        <option value="2">OpenAI TTS</option>
        <option value="3">AquesTalk</option>
        <option value="4">ModuleLLM</option>
      </select>
      <label for="tts_model">Model</label>
      <input type="text" id="tts_model" placeholder="" data-config="tts.model">
      <label for="tts_voice">Voice</label>
      <input type="text" id="tts_voice" placeholder="" data-config="tts.voice">
    </div>

    <!-- STT -->
    <div class="section">
      <h2>STT</h2>
      <label for="stt_type">Type</label>
      <select id="stt_type" class="select" data-config="stt.type">
        <option value="0">Google</option>
        <option value="1" selected>Groq Whisper</option>
        <option value="2">ModuleLLM ASR</option>
        <option value="3">ModuleLLM Whisper</option>
      </select>
      <label for="stt_model">Model</label>
      <input type="text" id="stt_model" placeholder="" data-config="stt.model">
    </div>

    <!-- Wakeword -->
    <div class="section">
      <h2>Wakeword</h2>
      <label for="ww_type">Type</label>
      <select id="ww_type" class="select" data-config="wakeword.type">
        <option value="0">SimpleVox</option>
        <option value="1">ModuleLLM KWS</option>
      </select>
      <label for="ww_keyword">Keyword</label>
      <input type="text" id="ww_keyword" placeholder="" data-config="wakeword.keyword">
    </div>

    <!-- Module LLM -->
    <div class="section">
      <h2>Module LLM</h2>
      <label for="mod_rxPin">RX Pin</label>
      <input type="number" id="mod_rxPin" placeholder="13" data-config="moduleLLM.rxPin">
      <label for="mod_txPin">TX Pin</label>
      <input type="number" id="mod_txPin" placeholder="14" data-config="moduleLLM.txPin">
    </div>

    <div class="btn-row" style="margin-top:1.5em">
      <button id="loadBtn2" class="btn btn-primary">Load from Robot</button>
      <button id="pushBtn2" class="btn btn-primary">Save & Push</button>
    </div>
  </div>
</body>
</html>
